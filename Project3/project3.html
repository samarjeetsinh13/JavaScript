<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,body{
            height: 100%;
            width: 100%;
            background-color: #464615;
        }

        .container{
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clock{
            height: 40px;
            width: 150px;
            background-color: #541217;
        }

        #clock-display{
            text-align: center;
            font-size: 30px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            padding: 5px 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="clock">
            <p id="clock-display">10:05:23</p>
        </div>
    </div>
</body>
    <script src="project3.js"></script>
</html>
