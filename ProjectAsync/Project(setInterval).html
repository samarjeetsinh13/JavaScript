<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        Change bg color every second
    </h1>

    <button id = "start">Start</button>
    <button id = "stop">Stop</button>
</body>
<script>
    let intervalID

    const body = document.querySelector("body")
    const start = document.querySelector('#start')
    const stop = document.querySelector('#stop')
    const cssColorNames = [
  "aliceblue", "antiquewhite", "aqua", "aquamarine", "azure", 
  "beige", "bisque", "black", "blanchedalmond", "blue", 
  "blueviolet", "brown", "burlywood", "cadetblue", "chartreuse", 
  "chocolate", "coral", "cornflowerblue", "cornsilk", "crimson", 
  "cyan", "darkblue", "darkcyan", "darkgoldenrod", "darkgray", 
  "darkgreen", "darkgrey", "darkkhaki", "darkmagenta", "darkolivegreen", 
  "darkorange", "darkorchid", "darkred", "darksalmon", "darkseagreen", 
  "darkslateblue", "darkslategray", "darkslategrey", "darkturquoise", 
  "darkviolet", "deeppink", "deepskyblue", "dimgray", "dimgrey", 
  "dodgerblue", "firebrick", "floralwhite", "forestgreen", "fuchsia", 
  "gainsboro", "ghostwhite", "gold", "goldenrod", "gray", 
  "green", "greenyellow", "grey", "honeydew", "hotpink", 
  "indianred", "indigo", "ivory", "khaki", "lavender", 
  "lavenderblush", "lawngreen", "lemonchiffon", "lightblue", "lightcoral", 
  "lightcyan", "lightgoldenrodyellow", "lightgray", "lightgreen", "lightgrey", 
  "lightpink", "lightsalmon", "lightseagreen", "lightskyblue", "lightslategray", 
  "lightslategrey", "lightsteelblue", "lightyellow", "lime", "limegreen", 
  "linen", "magenta", "maroon", "mediumaquamarine", "mediumblue", 
  "mediumorchid", "mediumpurple", "mediumseagreen", "mediumslateblue", "mediumspringgreen", 
  "mediumturquoise", "mediumvioletred", "midnightblue", "mintcream", "mistyrose", 
  "moccasin", "navajowhite", "navy", "oldlace", "olive", 
  "olivedrab", "orange", "orangered", "orchid", "palegoldenrod", 
  "palegreen", "paleturquoise", "palevioletred", "papayawhip", "peachpuff", 
  "peru", "pink", "plum", "powderblue", "purple", 
  "rebeccapurple", "red", "rosybrown", "royalblue", "saddlebrown", 
  "salmon", "sandybrown", "seagreen", "seashell", "sienna", 
  "silver", "skyblue", "slateblue", "slategray", "slategrey", 
  "snow", "springgreen", "steelblue", "tan", "teal", 
  "thistle", "tomato", "turquoise", "violet", "wheat", 
  "white", "whitesmoke", "yellow", "yellowgreen"
];

    const changeColour = function(){
        const randomIdx = Math.floor(Math.random()*cssColorNames.length)
        body.style.backgroundColor = cssColorNames[randomIdx]
    }
    const changeHex = function(){
        const hex = '0123456789ABCDEF'
        let color = '#'
        for(let i = 0;i<6;i++){
            color+=hex[Math.floor(Math.random()*10)]
        }
        body.style.backgroundColor = color
    }

    const startChangingColor = function(){
        if(!intervalID){
            intervalID = setInterval(changeHex, 45)
        }  
    }
    const stopChangingColor = function(){
        clearInterval(intervalID)
        intervalID = null//flush the intervalID better code
    }

    start.addEventListener('click', startChangingColor)
    stop.addEventListener('click', stopChangingColor)
</script>
</html>
