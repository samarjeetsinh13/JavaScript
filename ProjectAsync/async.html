<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
</body>
    <Script>
        const sayName = function(){
            console.log("sam");
        }
        const changeEle = function(){        
            document.querySelector('h1').innerHTML = "Samarjetsinh"
        }
        const changeME = setTimeout(changeEle, 2000)
        document.querySelector('#stop').addEventListener('click', function(){
            clearTimeout(changeME)
            console.log("Stopped");
        })
        
    </Script>
</html>
